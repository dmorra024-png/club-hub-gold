name: SNOOP Socio isolated scaffold checks
on:
  push:
    branches: [feature/snoop-socio-app-design-20261117]
    paths:
      - apps/socio/**
      - .github/workflows/snoop-socio-isolated-check.yml
  pull_request:
    paths:
      - apps/socio/**
      - .github/workflows/snoop-socio-isolated-check.yml
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate isolated member app without production secrets or API
        run: node apps/socio/check.mjs
      - name: Verify isolated membership, QR and wallet guards
        run: node --test apps/socio/domain.test.mjs apps/socio/service.test.mjs apps/socio/auto-link.test.mjs apps/socio/http.test.mjs apps/socio/integration.test.mjs apps/socio/auth-supabase.test.mjs apps/socio/supabase-rls.test.mjs apps/socio/bootstrap.test.mjs apps/socio/socio-role.test.mjs apps/socio/worker.test.mjs apps/socio/build-public.test.mjs apps/socio/wallet-operations.test.mjs
      - name: No deployment
        run: echo "Static-only checks; no Cloudflare deployment or Supabase mutations"
