name: SNOOP Socio isolated scaffold checks
on:
  push:
    branches: [feature/snoop-socio-app-design-20261117]
    paths:
      - apps/socio/**
      - .github/workflows/snoop-socio-isolated-check.yml
  pull_request:
    paths:
      - apps/socio/**
      - .github/workflows/snoop-socio-isolated-check.yml
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate isolated member app without production secrets or API
        run: node apps/socio/check.mjs
      - name: Verify isolated membership, QR and wallet guards
        run: node --test apps/socio/domain.test.mjs apps/socio/service.test.mjs apps/socio/auto-link.test.mjs apps/socio/http.test.mjs apps/socio/integration.test.mjs apps/socio/auth-supabase.test.mjs apps/socio/supabase-rls.test.mjs apps/socio/bootstrap.test.mjs apps/socio/socio-role.test.mjs apps/socio/worker.test.mjs apps/socio/build-public.test.mjs apps/socio/wallet-operations.test.mjs apps/socio/claim-challenges.test.mjs apps/socio/wallet-http.test.mjs apps/socio/cash-shifts.test.mjs apps/socio/wallet-cash-guards.test.mjs apps/socio/staff-scanner-http.test.mjs
      - name: No deployment
        run: echo "Static-only checks; no Cloudflare deployment or Supabase mutations"

  bundle-staging-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Install locked dependencies (staging only)
        run: bun install --frozen-lockfile
      - name: Package public member assets
        run: node apps/socio/build-public.mjs
      - name: Compile isolated staging Worker without deploying
        run: bunx wrangler deploy --dry-run --config apps/socio/wrangler.staging.jsonc --outdir "$GITHUB_WORKSPACE/.sandbox/socio-worker-dry-run"
      - name: Scan compiled output for secrets (no credentials supplied)
        run: |
          test -d .sandbox/socio-worker-dry-run
          test -n "$(find .sandbox/socio-worker-dry-run -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit)"
          if grep -R -E 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|DEEPGRAM_API_KEY|SOCIO_QR_SIGNING_KEY_BASE64=' .sandbox/socio-worker-dry-run; then
            echo "Unexpected secret marker in isolated Worker bundle"
            exit 1
          fi
      - name: Package downloadable client preview with instructions
        run: |
          mkdir -p .sandbox/snoop-socio-download
          cp apps/socio/dist/index.html apps/socio/dist/styles.css apps/socio/dist/main.js apps/socio/dist/manifest.webmanifest apps/socio/dist/sw.js apps/socio/dist/icon.svg .sandbox/snoop-socio-download/
          cat > .sandbox/snoop-socio-download/LEGGIMI.txt <<'INFO'
          SNOOP SOCIO — PWA CLIENT (ANTEPRIMA TECNICA)
          Questo pacchetto contiene solo l'interfaccia client originale SNOOP Socio.
          NON e' un APK, non contiene account demo e non include dati reali dei soci.
          Per installare la PWA su Android e iPhone, va pubblicata su un dominio HTTPS
          con il backend /api/socio configurato, verifiche email e database autorizzato.
          Aprire index.html come file locale NON attiva login, QR, saldo o Monedero.
          Non usare questo pacchetto per operazioni reali o distribuzione ai soci.
          NESSUN deposito di credenziali, chiavi API o dati personali nel pacchetto.
          INFO
      - name: Upload downloadable SNOOP Socio client preview
        uses: actions/upload-artifact@v4
        with:
          name: snoop-socio-client-preview
          path: .sandbox/snoop-socio-download/
          if-no-files-found: error
          retention-days: 30
      - name: No deployment or database connection
        run: echo "Staging packaging only; no network calls to private project"
