name: SNOOP Informes analytics — isolated validation
on:
  push:
    branches: [feature/snoop-caja-actionable-stats-theme-20261123]
    paths:
      - .github/workflows/snoop-informes-analytics-check.yml
      - docs/SNOOP_INFORMES_TEST_TRIGGER.md
  pull_request:
    branches: [release/snoop-caja-premium-validated-20261121]
permissions:
  contents: read
jobs:
  informes-ui-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - name: Ensure only Informes UI, style and tests changed
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/release/snoop-caja-premium-validated-20261121)"
          actual="$(git diff --name-only "$BASE" HEAD -- src apps/socio)"
          expected="$(printf '%s\n' 'src/routes/_authenticated/ajustes.informes.tsx' 'src/styles.css')"
          test "$actual" = "$expected" || { echo "Unexpected source files: $actual"; exit 1; }
          git diff --exit-code "$BASE" HEAD -- src/routes/_authenticated/caja.tsx src/lib/cash-sessions.ts src/lib/cash-sessions.server.ts
      - run: bun install --frozen-lockfile
      - name: Verify analytics UI, other modules and cash safety
        run: |
          set -euo pipefail
          node --test tests/snoop-informes-themed-insights.test.mjs tests/simple-cash.test.mjs
          bun run test:security:architecture
          bun run typecheck
      - name: Build SNOOP pilot bundle safely without publishing
        run: |
          set -euo pipefail
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
      - name: End validation without deployment
        run: echo 'SNOOP_INFORMES_VALIDATED_ONLY'
