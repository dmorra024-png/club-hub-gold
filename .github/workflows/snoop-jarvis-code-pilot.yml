name: SNOOP JARVIS — guarded full pilot release
on:
  push:
    branches: [release/jarvis-pilot-safe-20261126]
    paths:
      - .github/workflows/snoop-jarvis-code-pilot.yml
      - docs/JARVIS_SAFE_DEPLOY_TRIGGER.md
permissions:
  contents: read
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.event.head_commit.message == 'deploy-jarvis-full-pilot'
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - name: Verify isolated JARVIS source and immutable non-JARVIS modules
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/jarvis-pilot-safe-20261126"
          VERIFIED=6f20d120e18aa59b0dfe4c7d32a7b7dd74e0dc6d
          PREVIOUS=76c36e4b50aec59ffb1c2d2b1c505c97b2e37e38
          ALLOWED=$(git diff --name-only "$PREVIOUS" "$VERIFIED" -- src apps package.json bun.lock wrangler.json supabase scripts tests | sort)
          EXPECTED=$(printf '%s\n' \
            src/components/DeepgramPilotVoice.tsx \
            src/lib/deepgram-app-gateway.ts \
            src/lib/voice/agent-settings.server.ts \
            src/lib/voice/form-proposal.ts \
            tests/voice-app-coverage.test.ts \
            tests/voice-execution-registry.test.ts \
            tests/voice-navigation-shortcuts.test.ts | sort)
          test "$ALLOWED" = "$EXPECTED"
          DEPLOYED=3e7487088396cbd21edc99d454d88d9418dad0bb
          git cat-file -e "$VERIFIED^{commit}"
          git merge-base --is-ancestor "$VERIFIED" HEAD
          git diff --exit-code "$VERIFIED" HEAD -- src apps package.json bun.lock wrangler.json supabase scripts tests
          git diff --exit-code "$DEPLOYED" "$VERIFIED" -- apps/socio src/lib/wallet-management.functions.ts src/lib/cash-ledger.ts src/lib/cash-sessions.functions.ts src/lib/cash-sessions.server.ts package.json bun.lock wrangler.json supabase
          node -e 'const c=require("./wrangler.json");if(c.name!=="snoop-pilot"||c.workers_dev!==true||c.ai?.binding!=="SNOOP_AI"||c.assets?.binding!=="ASSETS"||c.vars?.SNOOP_RESOURCE_NAMESPACE!=="snoop-pilot")process.exit(1)'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: bun install --frozen-lockfile
      - name: Verify build, authorization boundaries and client bundle
        run: |
          set -euo pipefail
          bun run test
          bun run build:worker
          bun run typecheck
          bun run test:security:architecture
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Read-only verify protected Worker bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(res.status,200);
          const body=await res.json();
          assert.equal(body.success,true);
          const b=body.result?.bindings||[];
          for(const [name,type] of [['SUPABASE_SERVICE_ROLE_KEY','secret_text'],['SOCIO_QR_SIGNING_KEY_BASE64','secret_text'],['SNOOP_AI','ai'],['ASSETS','assets']]){
            assert.ok(b.some(x=>x.name===name&&x.type===type),'Missing protected binding '+name);
          }
          assert.equal(new Set(b.map(x=>x.name)).size,b.length);
          console.log('Existing protected bindings verified; no secret values read or changed.');
          NODE
      - name: Check live 29-command RPC is registered and deny anonymous access
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key=process.env.SUPABASE_PUBLISHABLE_KEY;
          assert.ok(key?.startsWith('sb_publishable_'));
          const response=await fetch(process.env.SUPABASE_URL+'/rest/v1/rpc/snoop_voice_command',{
            method:'POST',
            headers:{apikey:key,'content-type':'application/json'},
            body:JSON.stringify({p_request:'00000000-0000-4000-8000-000000000001',p_operation:'status',p_action:null,p_arguments:null,p_token:null,p_receipt_confirmed:false}),
            signal:AbortSignal.timeout(20000)
          });
          let payload={};try{payload=await response.json();}catch{}
          assert.equal(payload.code,'42501','Expected the installed full RPC to reject anonymous access before accessing any records');
          assert.ok(response.status===401 || response.status===403);
          console.log('Full voice RPC installed and anonymous access denied');
          NODE
      - name: Save protected binding inventory, without recording secret values
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const api='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings';
          const res=await fetch(api,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(res.status,200);
          const j=await res.json();assert.equal(j.success,true);
          const list=j.result?.bindings??[];
          const wallet=list.find(x=>x.name==='SNOOP_WALLET_OPERATIONS_ENABLED');
          const snapshot=list.map(x=>({name:x.name,type:x.type,...(x.name==='SNOOP_WALLET_OPERATIONS_ENABLED'?{text:x.text}: {})}));
          const types=Object.fromEntries(snapshot.map(x=>[x.name,x.type]));
          for(const [name,type] of Object.entries({SUPABASE_SERVICE_ROLE_KEY:'secret_text',SOCIO_QR_SIGNING_KEY_BASE64:'secret_text',SNOOP_AI:'ai',ASSETS:'assets'}))assert.equal(types[name],type);
          assert.equal(new Set(list.map(x=>x.name)).size,list.length);
          if(wallet)assert.equal(wallet.type,'plain_text');
          writeFileSync(process.env.RUNNER_TEMP+'/snoop-pilot-binding-snapshot.json',JSON.stringify(snapshot));
          console.log('Existing wallet state and protected bindings captured safely');
          NODE
      - name: Enable only the JARVIS execution flag in the generated Pilot Worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='.output/server/wrangler.json';
          const config=JSON.parse(readFileSync(path,'utf8'));
          assert.equal(config.name,'snoop-pilot');
          assert.equal(config.ai?.binding,'SNOOP_AI');
          assert.equal(config.assets?.binding,'ASSETS');
          assert.equal(config.vars?.SNOOP_RESOURCE_NAMESPACE,'snoop-pilot');
          assert.ok(!Object.hasOwn(config.vars,'SNOOP_WALLET_OPERATIONS_ENABLED'),'Existing Monedero flag must stay inherited');
          config.vars.SNOOP_VOICE_EXECUTION_PILOT_ENABLED='true';
          writeFileSync(path,JSON.stringify(config,null,2));
          console.log('JARVIS full execution enabled for Pilot only; Monedero inherited untouched');
          NODE
      - name: Verify existing pilot availability before deployment
        run: curl -fsS --max-time 25 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-before
      - name: Publish full JARVIS to the existing Pilot preserving all variables and secrets
        run: WRANGLER_SEND_METRICS=false bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Verify live JARVIS flag and unchanged protected bindings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const prev=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/snoop-pilot-binding-snapshot.json','utf8'));
          const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(res.status,200);
          const body=await res.json();assert.equal(body.success,true);
          const list=body.result?.bindings??[];
          const flag=list.find(x=>x.name==='SNOOP_VOICE_EXECUTION_PILOT_ENABLED');
          assert.equal(flag?.type,'plain_text');
          assert.equal(flag?.text,'true');
          for(const item of prev){
            const after=list.find(x=>x.name===item.name);
            assert.equal(after?.type,item.type,'Missing or changed existing binding: '+item.name);
            if(item.name==='SNOOP_WALLET_OPERATIONS_ENABLED')assert.equal(after?.text,item.text,'Monedero status must not change');
          }
          assert.equal(new Set(list.map(x=>x.name)).size,list.length);
          console.log('Full JARVIS live; all previous binding names/types and Monedero state preserved');
          NODE
      - name: Verify pilot website is online
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-after
          grep -qi 'snoop' /tmp/snoop-after
          echo 'SNOOP_JARVIS_FULL_PILOT_PUBLISHED'
