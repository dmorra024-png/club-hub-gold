name: SNOOP approved home and four equal navigation controls (no deploy)
on:
  push:
    branches: [feature/snoop-approved-four-equal-nav-home-20261119]
    paths:
      - .github/workflows/snoop-approved-home-check.yml
      - src/routes/_authenticated/index.tsx
      - src/components/SnoopLayout.tsx
      - src/styles.css
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install
      - name: SNOOP home layout, seven theme choices, real data and equal four buttons
        run: |
          bun run typecheck
          bun run test:security:architecture
          bun run test:voice:activation
          node --test tests/qwen-id-fields.test.ts tests/snoop-theme-composition.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const home=readFileSync('src/routes/_authenticated/index.tsx','utf8');
          const layout=readFileSync('src/components/SnoopLayout.tsx','utf8');
          const css=readFileSync('src/styles.css','utf8');
          const themes=readFileSync('src/lib/snoop-themes.ts','utf8');
          for(const name of ['snoop-approved-welcome','snoop-approved-cash','snoop-approved-shortcuts','snoop-approved-activity','ClubActivities'])assert.ok(home.includes(name),name);
          assert.ok(!home.includes('Turnos de hoy'),'No rejected shift widget');
          assert.ok(!home.includes('432,80'),'Never fake a financial balance');
          assert.ok(home.includes('can("use_cash")'),'Cash remains permission gated');
          assert.ok(layout.includes('SnoopWordmark'),'Real logo preserved');
          assert.ok(layout.includes('snoop:voice-toggle'),'Original voice control preserved');
          assert.match(css,/grid-template-columns:repeat\(4,minmax\(0,1fr\)\)/);
          assert.match(css,/premium-bottom-nav>:is\(a,button\)/);
          for(const id of ['navy-gold','graphite-copper','aubergine-amethyst','petrol-titanium','ivory-champagne','ruby-gold','emerald-gold'])assert.ok(themes.includes('"'+id+'"'));
          console.log('PASS approved visual structure with four equal footer slots and seven club palettes');
          NODE
      - name: Build Worker only (do not publish)
        env:
          SNOOP_RESOURCE_NAMESPACE: snoop-pilot
          SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
          VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: |
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
