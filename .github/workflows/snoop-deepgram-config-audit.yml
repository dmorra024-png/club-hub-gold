name: SNOOP Deepgram pilot secret presence audit
on:
  push:
    branches: [feature/deepgram-admin-pilot-20261116]
    paths:
      - scripts/audit-deepgram-configuration.mjs
      - .github/workflows/snoop-deepgram-config-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: snoop-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only binding names and types, no secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
        run: node scripts/audit-deepgram-configuration.mjs
