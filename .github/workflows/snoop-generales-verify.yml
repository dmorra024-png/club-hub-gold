name: SNOOP Generales verification

on:
  push:
    branches:
      - fix/snoop-club-merma-policy-20261123

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - run: bun install --frozen-lockfile
      - name: Verify Generales, discounts, check-ins and merma
        run: |
          node --test tests/snoop-generales-settings.test.mjs tests/snoop-club-merma-policy.test.mjs tests/snoop-order-payment-merma.test.mjs tests/snoop-wallet-credit-only-topup-methods.test.mjs tests/simple-cash.test.mjs
          bun run test:annulment:concurrency
      - name: Compile Worker before any deployment
        run: |
          set -euo pipefail
          bun run build:worker
          bun run typecheck
          bun run worker:dry-run
          bun run test:security:bundle
