name: SNOOP member home typography pilot — guarded release
on:
  push:
    branches: [fix/snoop-member-home-fonts-20261120]
    paths: [docs/SNOOP_MEMBER_HOME_FONTS_RELEASE_TRIGGER.md]
permissions:
  contents: read
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.event.head_commit.message == 'release-snoop-member-home-fonts-pilot'
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.12'}
      - run: bun install --frozen-lockfile
      - name: Require only member-detail layout source change
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/fix/snoop-member-detail-photo-signature-grid-20261120)"
          actual="$(git diff --name-only "$BASE" HEAD -- src apps/socio)"
          expected="$(printf '%s\n' 'src/routes/_authenticated/soci.$id.tsx' 'src/styles.css')"
          test "$actual" = "$expected" || { echo "Unexpected application changes: $actual"; exit 1; }
          test "$(git diff --numstat "$BASE" HEAD -- 'src/routes/_authenticated/soci.$id.tsx')" = "$(printf '1\t1\tsrc/routes/_authenticated/soci.$id.tsx')" || { echo "Member component changed beyond typography scope"; exit 1; }
          test "$(git diff --numstat "$BASE" HEAD -- src/styles.css)" = "$(printf '42\t0\tsrc/styles.css')" || { echo "CSS additions out of scope"; exit 1; }
          if git diff "$BASE" HEAD -- 'src/routes/_authenticated/soci.$id.tsx' | grep -E '^\+[^+].*(from\(|insert\(|update\(|delete\(|onClick=|onConfirm=|navigate\(|supabase\.)'; then
            echo 'Potential business-logic edit found; abort'
            exit 1
          fi
          echo 'Only member card styling changed'
      - name: Run scoped tests and typecheck
        run: |
          set -euo pipefail
          node --test tests/snoop-gestionale-visual-consistency.test.mjs tests/snoop-dock-cash-chart-visual.test.mjs
          bun run typecheck
      - name: Build, dry-run and security check
        run: |
          set -euo pipefail
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Verify existing production secret bindings without changes
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings';
          const res=await fetch(url,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
          assert.equal(res.status,200);
          const j=await res.json();
          assert.equal(j.success,true);
          const b=j.result?.bindings||[];
          for(const [name,types] of Object.entries({
            SUPABASE_SERVICE_ROLE_KEY:['secret_text'],SOCIO_QR_SIGNING_KEY_BASE64:['secret_text'],SNOOP_AI:['ai'],ASSETS:['assets']
          })){
            assert.ok(b.some(x=>x.name===name&&types.includes(x.type)),'Missing worker binding '+name);
          }
          assert.equal(new Set(b.map(x=>x.name)).size,b.length);
          console.log('Existing secret bindings verified, values never read or overwritten.');
          NODE
      - name: Deploy only SNOOP management pilot (keep bindings)
        run: WRANGLER_SEND_METRICS=false bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Verify live application response
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-home
          grep -qi 'snoop' /tmp/snoop-home
          echo 'SNOOP_MEMBER_MOBILE_LAYOUT_PILOT_DEPLOYED'
