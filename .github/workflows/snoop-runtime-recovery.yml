name: SNOOP runtime settings recovery (no code deployment)
on:
  push:
    branches: [ops/snoop-runtime-recovery]
    paths:
      - .github/workflows/snoop-runtime-recovery.yml
      - scripts/recover-snoop-runtime.mjs
permissions:
  contents: read
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.ref == 'refs/heads/ops/snoop-runtime-recovery'
    environment: snoop-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover only verified prior runtime variables and disable automatic Builds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
          SNOOP_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/recover-snoop-runtime.mjs
