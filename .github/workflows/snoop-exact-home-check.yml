name: SNOOP exact approved home visual constraints (no deploy)
on:
  push:
    branches: [fix/snoop-exact-approved-home-20261119]
    paths:
      - .github/workflows/snoop-exact-home-check.yml
      - src/routes/_authenticated/index.tsx
      - src/components/SnoopLayout.tsx
      - src/styles.css
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install
      - name: Compile and check existing access, scanner and voice
        run: |
          bun run typecheck
          bun run test:security:architecture
          bun run test:voice:activation
          node --test tests/qwen-id-fields.test.ts tests/snoop-theme-composition.test.mjs
      - name: Protect approved placement, true original SVG, source-data security and seven themes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const src=x=>readFileSync(x,'utf8');
          const h=src('src/routes/_authenticated/index.tsx'),l=src('src/components/SnoopLayout.tsx'),css=src('src/styles.css'),t=src('src/lib/snoop-themes.ts');
          assert.match(h,/snoop-approved-welcome/);
          assert.match(h,/snoop-approved-cash/);
          assert.match(h,/snoop-approved-shortcuts/);
          assert.match(h,/ClubActivities/);
          assert.ok(!h.includes('432,80'),'No screenshot-baked financial amounts');
          assert.ok(!h.includes('Turnos de hoy'),'Never add rejected shift block');
          assert.match(h,/canSeeCash/);
          assert.match(l,/<SnoopWordmark\s*\/>/);
          assert.match(l,/snoop-approved-assistant-mark/);
          assert.match(l,/snoop:voice-toggle/);
          assert.match(css,/EXACT APPROVED MOBILE COMPOSITION/);
          assert.match(css,/grid-template-columns:repeat\(4,minmax\(0,1fr\)\)/);
          for(const id of ['navy-gold','graphite-copper','aubergine-amethyst','petrol-titanium','ivory-champagne','ruby-gold','emerald-gold'])
            assert.ok(t.includes('"'+id+'"'),id);
          console.log('PASS approved layout & original logo & real data & 4 equal nav controls & 7 themes');
          NODE
      - name: Build worker without publishing
        env:
          SNOOP_RESOURCE_NAMESPACE: snoop-pilot
          SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
          VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: |
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
