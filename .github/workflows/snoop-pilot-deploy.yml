name: SNOOP pilot — deploy manually (no Security PSG)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-SNOOP-PILOT to authorize deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false

jobs:
  deploy-snoop:
    if: ${{ github.repository == 'dmorra024-png/club-hub-gold' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-SNOOP-PILOT' }}
    runs-on: ubuntu-latest
    environment: snoop-pilot
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SNOOP_CLOUDFLARE_ACCOUNT_ID }}
      SNOOP_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SNOOP_SUPABASE_SERVICE_ROLE_KEY }}
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      CI: 'true'
    steps:
      - name: Checkout only SNOOP branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: codex/stabilize-independent-club
      - name: Guard target and required secrets (do not print values)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dmorra024-png/club-hub-gold"
          test "$GITHUB_REF_NAME" = "main"
          node -e 'const c=require("./wrangler.json"); if(c.name!=="snoop-pilot" || c.workers_dev!==true || !c.ai || c.ai.binding!=="SNOOP_AI")process.exit(1)'
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SNOOP_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name"; exit 1; }
          done
          [[ "$SNOOP_PUBLISHABLE_KEY" == sb_publishable_* ]] || { echo "Wrong public key type"; exit 1; }
          [[ "$SUPABASE_SERVICE_ROLE_KEY" != sb_publishable_* ]] || { echo "Private service key is invalid"; exit 1; }
          echo "Target validated: SNOOP pilot (no Security PSG resources)"
      - name: Validate Cloudflare credential before any build or deployment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const raw = process.env.CLOUDFLARE_API_TOKEN ?? '';
          const token = raw.trim();
          if (!token || /[\\r\\n\\x00-\\x1f\\x7f]/.test(token) || /\\s/.test(token) || /^Bearer\\s/i.test(token)) {
            console.error('Invalid SNOOP_CLOUDFLARE_API_TOKEN format: save only the raw API token, with no Bearer prefix, quotes or line breaks.');
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID ?? '') || process.env.CLOUDFLARE_ACCOUNT_ID !== '0cc810f68820d22996af3aed9e081e93') {
            console.error('Cloudflare account ID does not match the approved SNOOP account.');
            process.exit(1);
          }
          console.log('Cloudflare token formatting checked; verifying with Cloudflare...');
          const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
            headers: { Authorization: 'Bearer ' + token },
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.success !== true || result.result?.status !== 'active') {
            console.error('Cloudflare rejected the API token. Check its validity and Workers Scripts Edit permission. HTTP ' + response.status);
            process.exit(1);
          }
          // Preserve the cleaned token only in this workflow's protected runner environment.
          appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_API_TOKEN=' + token + '\\n');
          console.log('Cloudflare API token verified as active.');
          NODE
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Validate SQL security and TypeScript
        run: |
          bun run test:security:initialization
          bun run typecheck
      - name: Build Cloudflare Worker (only public key embedded)
        shell: bash
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Deploy only snoop-pilot on the selected Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          # Validate the generated config still targets exactly snoop-pilot.
          node -e 'const c=require("./.output/server/wrangler.json");if(c.name!=="snoop-pilot")throw Error("Wrong Worker target")'
          bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Upload private server settings (never logged)
        shell: bash
        run: |
          set -euo pipefail
          # Protected runtime secret supplied through stdin; never placed in repo or build bundle.
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config .output/server/wrangler.json
          printf '%s' "$SUPABASE_URL" | bunx wrangler secret put SUPABASE_URL --config .output/server/wrangler.json
          printf '%s' "$SNOOP_PUBLISHABLE_KEY" | bunx wrangler secret put SUPABASE_PUBLISHABLE_KEY --config .output/server/wrangler.json
          printf '%s' "$APP_URL" | bunx wrangler secret put APP_URL --config .output/server/wrangler.json
      - name: Sanity check HTTPS (does not register users)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null --max-time 30 "$APP_URL/auth"
          echo "SNOOP pilot is reachable at the configured HTTPS origin."
