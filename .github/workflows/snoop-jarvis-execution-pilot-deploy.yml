name: SNOOP JARVIS execution — guarded Pilot release
on:
  push:
    branches: [feature/snoop-double-stock-20261123]
    paths: [docs/JARVIS_EXECUTION_DEPLOY_TRIGGER.md]
permissions:
  contents: read
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.event.head_commit.message == 'deploy-snoop-jarvis-execution-pilot'
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - name: Guard Pilot-only target and already-reviewed integrations
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/snoop-double-stock-20261123"
          # Both source histories are mandatory. No direct publishing of old Codex tree.
          git merge-base --is-ancestor a41084887c157d304b822b20186bbffb5cd63561 HEAD
          git merge-base --is-ancestor 03b314c6231b6a3e72a37ff385105e0b653b8615 HEAD
          # The final trigger itself cannot change any application or deployment logic.
          git diff --exit-code HEAD^ HEAD -- src apps/socio package.json bun.lock wrangler.json supabase scripts tests .github/workflows
          node - <<'NODE'
          const c=require('./wrangler.json');
          if(c.name!=='snoop-pilot'||!c.workers_dev||c.ai?.binding!=='SNOOP_AI'||c.assets?.binding!=='ASSETS'||c.vars?.SNOOP_RESOURCE_NAMESPACE!=='snoop-pilot'||c.vars?.SNOOP_VOICE_EXECUTION_PILOT_ENABLED!=='true') process.exit(1);
          if(c.vars?.SNOOP_WALLET_OPERATIONS_ENABLED === 'true') process.exit(1);
          NODE
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: bun install --frozen-lockfile
      - name: Build first to generate TanStack routes, then verify application and security
        run: |
          set -euo pipefail
          bun run build:worker
          bun run typecheck
          bun run test:security:architecture
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Read-only verification of existing Pilot Worker bindings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(res.status,200);
          const json=await res.json();
          assert.equal(json.success,true);
          const bindings=json.result?.bindings??[];
          const b=new Map(bindings.map(x=>[x.name,x.type]));
          assert.equal(b.size,bindings.length);
          for(const [name,type] of [['SUPABASE_SERVICE_ROLE_KEY','secret_text'],['SOCIO_QR_SIGNING_KEY_BASE64','secret_text'],['SNOOP_AI','ai'],['ASSETS','assets']])
            assert.equal(b.get(name),type,'Missing protected Pilot binding: '+name);
          const knownResources=bindings.filter(x=>!['secret_text','plain_text','json','secret_key'].includes(x.type)&&!((x.name==='SNOOP_AI'&&x.type==='ai')||(x.name==='ASSETS'&&x.type==='assets')));
          assert.equal(knownResources.length,0,'Unexpected Worker resource bindings');
          // Do not log any secret or any personal allowlist UUID.
          console.log('Protected Pilot bindings checked without reading secret values.');
          assert.equal(b.get('DEEPGRAM_API_KEY'),'secret_text','Live Deepgram pilot secret absent; abort rather than publish an unusable voice pilot.');
          for(const name of ['SNOOP_DEEPGRAM_PILOT_ENABLED','SNOOP_DEEPGRAM_PILOT_USER_ID','SNOOP_DEEPGRAM_PILOT_CLUB_ID'])
            assert.ok(b.has(name),'Missing restricted Deepgram pilot allowlist binding '+name);
          console.log('Deepgram key and scoped Pilot allowlist binding names verified; values not logged.');
          NODE
      - name: Verify live Pilot before deployment
        run: curl -fsS --max-time 25 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-before
      - name: Deploy reviewed JARVIS code only to snoop-pilot, preserving all secrets and runtime settings
        run: WRANGLER_SEND_METRICS=false bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Verify Pilot availability after deployment
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-after
          grep -qi 'snoop' /tmp/snoop-after
          echo 'JARVIS_PILOT_CODE_PUBLISHED_NO_REAL'
