name: SNOOP global JARVIS UI and report regression checks
on:
  push:
    branches: [feature/snoop-global-jarvis-motion-20261119]
    paths:
      - .github/workflows/snoop-global-jarvis-check.yml
      - src/components/JarvisVisualOverlay.tsx
      - src/components/SnoopLayout.tsx
      - src/styles.css
      - src/routes/_authenticated/ajustes.informes.tsx
      - src/routes/_authenticated/index.tsx
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install
      - name: Typecheck, existing security, voice & scanner regressions
        run: |
          bun run typecheck
          bun run test:security:architecture
          bun run test:voice:activation
          node --test tests/qwen-id-fields.test.ts tests/snoop-theme-composition.test.mjs
      - name: Jarvis accessibility, report styles, home and command wiring checks
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=x=>readFileSync(x,'utf8');
          const css=read('src/styles.css'),hud=read('src/components/JarvisVisualOverlay.tsx'),
                layout=read('src/components/SnoopLayout.tsx'),report=read('src/routes/_authenticated/ajustes.informes.tsx'),
                home=read('src/routes/_authenticated/index.tsx');
          assert.ok(layout.includes('JarvisVisualOverlay'));
          assert.ok(layout.includes('snoop:voice-toggle'),'Real voice engine event retained');
          assert.ok(layout.includes('useVoicePhase'),'Real voice state retained');
          for(const word of ['recording','starting','processing'])assert.ok(hud.includes(word));
          assert.match(css,/@media\(prefers-reduced-motion:reduce\)/);
          assert.match(css,/jarvis-ring-outer/);
          assert.match(css,/snoop-hud-kpi/);
          assert.ok(!report.includes('#39FF14'),'No bright default green in reports');
          assert.ok(!report.includes('strokeDasharray="3 3"'),'Remove dashed default grids');
          assert.ok(!home.includes('Turnos de hoy'),'No rejected shift widget');
          assert.ok(home.includes('ClubActivities'));
          assert.ok(home.includes('can("use_cash")'),'Cash still access-controlled');
          console.log('PASS futuristic UI with no new voice/data access');
          NODE
      - name: Build without deployment
        env:
          SNOOP_RESOURCE_NAMESPACE: snoop-pilot
          SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
          VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: |
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
