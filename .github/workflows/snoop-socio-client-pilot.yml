name: SNOOP Socio — independent client pilot release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Enter DEPLOY-SNOOP-SOCIO to publish the client pilot"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: snoop-socio-pilot-deploy
  cancel-in-progress: false

jobs:
  deploy-socio:
    if: ${{ github.repository == 'dmorra024-png/club-hub-gold' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-SNOOP-SOCIO' }}
    runs-on: ubuntu-latest
    environment: snoop-pilot
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
      SOCIO_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SOCIO_ORIGIN: https://snoop-socio-pilot.dmorra024.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: __PINNED_SOCIO_SHA__
      - name: Verify exact release scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dmorra024-png/club-hub-gold"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "__PINNED_SOCIO_SHA__"
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$SOCIO_PUBLISHABLE_KEY"
          [[ "$SOCIO_PUBLISHABLE_KEY" == sb_publishable_* ]]
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("apps/socio/wrangler.pilot.jsonc","utf8"));if(c.name!=="snoop-socio-pilot"||c.vars.SOCIO_ORIGIN!=="https://snoop-socio-pilot.dmorra024.workers.dev"||c.assets.binding!=="ASSETS")process.exit(1)'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate client, safety and public-only bundle
        run: |
          set -euo pipefail
          node apps/socio/check.mjs
          node --test apps/socio/domain.test.mjs apps/socio/auth-supabase.test.mjs apps/socio/service.test.mjs apps/socio/http.test.mjs apps/socio/worker.test.mjs apps/socio/build-public.test.mjs apps/socio/claim-challenges.test.mjs
          node apps/socio/build-public.mjs
          test -f apps/socio/dist/snoop-wordmark.svg
          test ! -f apps/socio/dist/worker.mjs
      - name: Inspect dedicated Worker bindings without reading any secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const names=['snoop-socio-pilot','snoop-pilot'];
          const present={};
          for(const name of names){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/0cc8106f8820d22996af3aed9e081e93/workers/scripts/'+name+'/settings',{
              headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)
            });
            if(r.status===404){present[name]=[];continue;}
            const data=await r.json();
            if(!r.ok||data.success!==true||!Array.isArray(data.result?.bindings))throw Error('Unable to verify Worker bindings');
            present[name]=data.result.bindings.map(b=>({name:b.name,type:b.type}));
          }
          const socio=present['snoop-socio-pilot'],admin=present['snoop-pilot'];
          if(!admin.some(b=>b.name==='SUPABASE_SERVICE_ROLE_KEY'&&b.type==='secret_text'))throw Error('Management worker is not the expected secure SNOOP pilot');
          for(const name of names){
            const duplicates=present[name].map(b=>b.name);
            if(new Set(duplicates).size!==duplicates.length)throw Error('Duplicate Worker bindings');
          }
          const has=(name,key)=>present[name].some(b=>b.name===key&&b.type==='secret_text');
          const socioQr=has('snoop-socio-pilot','SOCIO_QR_SIGNING_KEY_BASE64');
          const adminQr=has('snoop-pilot','SOCIO_QR_SIGNING_KEY_BASE64');
          if(socioQr!==adminQr)throw Error('Partial QR key installation; do not rotate or replace existing keys');
          const pub=has('snoop-socio-pilot','SOCIO_SUPABASE_PUBLISHABLE_KEY');
          appendFileSync(process.env.GITHUB_ENV,'SOCIO_QR_EXISTING='+String(socioQr)+'\nSOCIO_PUBLISHABLE_EXISTING='+String(pub)+'\n');
          console.log(JSON.stringify({newWorker:socio.length===0,qrKeyPresentInBoth:socioQr,publicKeyPresent:pub}));
          NODE
      - name: Configure independent client secrets and shared QR verification key
        shell: bash
        run: |
          set -euo pipefail
          export WRANGLER_SEND_METRICS=false
          if [ "$SOCIO_QR_EXISTING" != "true" ]; then
            KEY="$(openssl rand -base64 32 | tr -d '\n')"
            # Keep key only in this step's memory; never echo it into build files or logs.
            printf '%s' "$KEY" | npx wrangler secret put SOCIO_QR_SIGNING_KEY_BASE64 --name snoop-socio-pilot >/dev/null
            printf '%s' "$KEY" | npx wrangler secret put SOCIO_QR_SIGNING_KEY_BASE64 --name snoop-pilot >/dev/null
            unset KEY
          fi
          if [ "$SOCIO_PUBLISHABLE_EXISTING" != "true" ]; then
            printf '%s' "$SOCIO_PUBLISHABLE_KEY" | npx wrangler secret put SOCIO_SUPABASE_PUBLISHABLE_KEY --name snoop-socio-pilot >/dev/null
          fi
      - name: Deploy only SNOOP Socio client Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config apps/socio/wrangler.pilot.jsonc --keep-vars
      - name: Verify separate HTTPS app and fail-closed API boundary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$SOCIO_ORIGIN/" -o /tmp/snoop-socio.html
          grep -q "SNOOP · Socio" /tmp/snoop-socio.html
          curl -fsS --max-time 30 "$SOCIO_ORIGIN/snoop-wordmark.svg" -o /tmp/snoop-socio-logo.svg
          grep -q 'viewBox="0 0 470 60"' /tmp/snoop-socio-logo.svg
          CODE="$(curl -sS --max-time 30 -o /tmp/socio-response -w '%{http_code}' "$SOCIO_ORIGIN/api/socio/me")"
          test "$CODE" = 401
          echo "SNOOP_SOCIO_PILOT_CLIENT_DEPLOYED"
