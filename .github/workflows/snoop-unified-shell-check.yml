name: SNOOP global premium shell and navigation regression checks
on:
  push:
    branches: [fix/snoop-unified-shell-premium-navigation-20261119]
    paths:
      - .github/workflows/snoop-unified-shell-check.yml
      - src/components/SnoopDockIcon.tsx
      - src/components/SnoopLayout.tsx
      - src/hooks/useClubTheme.ts
      - src/styles.css
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - run: bun install
      - name: Compile and guard auth, voice, scanner and theme behavior
        run: |
          bun run typecheck
          bun run test:security:architecture
          bun run test:voice:activation
          node --test tests/qwen-id-fields.test.ts tests/snoop-theme-composition.test.mjs
      - name: Verify premium shell consistency on every route
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>readFileSync(p,'utf8');
          const layout=read('src/components/SnoopLayout.tsx');
          const icons=read('src/components/SnoopDockIcon.tsx');
          const css=read('src/styles.css');
          const theme=read('src/hooks/useClubTheme.ts');
          const palettes=read('src/lib/snoop-themes.ts');
          assert.ok(layout.includes('premium-shell snoop-unified-shell'));
          assert.ok(layout.includes('<SnoopReferenceWaves />'),'Identical background on all routes');
          assert.ok(layout.includes('className="premium-header-brand"'));
          assert.ok(layout.includes('snoop-approved-header-actions'));
          assert.ok(layout.includes('snoop:voice-toggle'),'JARVIS logic unchanged');
          for(const name of ['home','qr','jarvis','profile'])assert.ok(layout.includes('kind="'+name+'"'));
          assert.ok(icons.includes('function SnoopDockIcon'));
          assert.ok(css.includes('grid-template-columns:repeat(4,minmax(0,1fr))'));
          assert.ok(css.includes('left:50%;top:50%'),'Header logo centered by viewport not siblings');
          assert.ok(css.includes('premium-main:not(.snoop-approved-home)'),'Other pages share shell');
          assert.ok(theme.includes('if (!clubId) return'),'No default-theme flash during auth loading');
          for(const id of ['navy-gold','graphite-copper','aubergine-amethyst','petrol-titanium','ivory-champagne','ruby-gold','emerald-gold'])
            assert.ok(palettes.includes('"'+id+'"'));
          console.log('PASS consistent four-slot premium icons, viewport-centered logo, all-route visual shell and 7 themes');
          NODE
      - name: Compile and dry-run Cloudflare Worker without deployment
        env:
          SNOOP_RESOURCE_NAMESPACE: snoop-pilot
          SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
          VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: |
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
