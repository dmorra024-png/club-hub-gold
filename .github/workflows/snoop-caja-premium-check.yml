name: SNOOP Caja premium — isolated regression checks
on:
  pull_request:
    branches: [fix/snoop-member-home-fonts-20261120]
  push:
    branches: [feature/snoop-caja-premium-report-20261121]
    paths:
      - docs/SNOOP_CAJA_PREMIUM_TEST_TRIGGER.md
      - .github/workflows/snoop-caja-premium-check.yml
permissions:
  contents: read
jobs:
  caja-regression:
    if: github.repository == 'dmorra024-png/club-hub-gold'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Locked dependencies
        run: bun install --frozen-lockfile
      - name: Guard strictly UI-only changes
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/fix/snoop-member-home-fonts-20261120)"
          diff="$(git diff --name-only "$BASE" HEAD -- src apps/socio)"
          expected="$(printf '%s\n' 'src/routes/_authenticated/caja.tsx' 'src/styles.css')"
          test "$diff" = "$expected" || { printf 'Unexpected app files changed: %s\n' "$diff"; exit 1; }
          test -z "$(git diff --name-only "$BASE" HEAD -- src/lib src/components apps/socio)" || exit 1
          echo "Only presentation-layer Caja and style files changed"
      - name: Cash tests and payment safety regressions
        run: |
          set -euo pipefail
          node --test tests/snoop-caja-premium-report.test.mjs tests/simple-cash.test.mjs
          bun run test:security:architecture
          bun run test:annulment:concurrency
      - name: TypeScript check
        run: bun run typecheck
      - name: Compile browser and Cloudflare Worker without deploying
        run: |
          set -euo pipefail
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Confirm exact targeted branch remains unpublished
        run: echo "VALIDATED_ONLY_NO_DEPLOY"
