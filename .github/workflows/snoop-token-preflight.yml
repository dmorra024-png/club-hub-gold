name: SNOOP Cloudflare token preflight
on:
  push:
    branches: [codex/stabilize-independent-club]
    paths: [.github/workflows/snoop-token-preflight.yml]
permissions:
  contents: read
jobs:
  token-check:
    if: github.repository == 'dmorra024-png/club-hub-gold'
    runs-on: ubuntu-latest
    environment: snoop-pilot
    timeout-minutes: 4
    env:
      SNOOP_CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check limited SNOOP Worker settings access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.SNOOP_CLOUDFLARE_API_TOKEN;
          if (!token) {
            console.error('SNOOP_TOKEN_MISSING_IN_GITHUB_ENVIRONMENT');
            process.exitCode = 2;
          } else {
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4/accounts/0cc8106f8820d22996af3aed9e081e93/workers/scripts/snoop-pilot/settings', {
                headers: { Authorization: 'Bearer ' + token },
                redirect: 'error',
                signal: AbortSignal.timeout(12000),
              });
              console.log('SNOOP_CLOUDFLARE_SETTINGS_HTTP_' + response.status);
              if (response.status !== 200) process.exitCode = 3;
            } catch {
              console.error('SNOOP_CLOUDFLARE_NETWORK_ERROR');
              process.exitCode = 4;
            }
          }
          NODE
