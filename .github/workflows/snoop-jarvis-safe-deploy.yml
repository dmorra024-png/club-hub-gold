name: SNOOP JARVIS integrated Pilot — guarded publish
on:
  push:
    branches: [integration/jarvis-pilot-safe-20261124]
    paths: [docs/JARVIS_SAFE_DEPLOY_TRIGGER.md]
permissions: {contents: read}
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.event.head_commit.message == 'deploy-snoop-jarvis-safe-pilot'
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - name: Verify exact safe integration and protected scopes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "integration/jarvis-pilot-safe-20261124"
          BASE=a41084887c157d304b822b20186bbffb5cd63561
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- apps/socio wrangler.json package.json bun.lock supabase src/lib/cash-ledger.ts src/lib/cash-sessions.functions.ts src/lib/cash-sessions.server.ts src/lib/member-order-history.server.ts src/routes/_authenticated/caja.tsx src/routes/_authenticated/productos.tsx src/components/WarehouseManager.tsx
          node -e 'const c=require("./wrangler.json");if(c.name!=="snoop-pilot"||c.workers_dev!==true||c.ai?.binding!=="SNOOP_AI"||c.assets?.binding!=="ASSETS"||c.vars?.SNOOP_RESOURCE_NAMESPACE!=="snoop-pilot"||c.vars?.SNOOP_VOICE_EXECUTION_PILOT_ENABLED==="true")process.exit(1)'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          echo "Safe JARVIS Pilot target and source ancestry checked"
      - run: bun install --frozen-lockfile
      - name: Validate compiled Worker, TS, permissions and bundle
        run: |
          set -euo pipefail
          bun run typecheck
          bun run build:worker
          bun run test:security:architecture
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Verify protected bindings are preserved, execution flag remains off
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(response.status,200);
          const body=await response.json();
          assert.equal(body.success,true);
          const bindings=body.result?.bindings??[];
          for(const [name,type] of [['SUPABASE_SERVICE_ROLE_KEY','secret_text'],['SOCIO_QR_SIGNING_KEY_BASE64','secret_text'],['SNOOP_AI','ai'],['ASSETS','assets']]){
            assert.ok(bindings.some(b=>b.name===name&&b.type===type),'Missing required protected binding '+name);
          }
          assert.equal(new Set(bindings.map(b=>b.name)).size,bindings.length);
          const flag=bindings.find(b=>b.name==='SNOOP_VOICE_EXECUTION_PILOT_ENABLED');
          assert.ok(!flag || (flag.type==='plain_text' && flag.text==='false'),'Persistent voice execution must remain disabled until reviewed migration is applied');
          console.log('Binding names and types verified; execution remains disabled; no secrets printed');
          NODE
      - name: Existing Pilot reachable before upload
        run: curl -fsS --max-time 25 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-before
      - name: Publish JARVIS candidate into existing Pilot, preserving bindings
        run: WRANGLER_SEND_METRICS=false bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Verify Pilot online after upload
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-after
          grep -qi 'snoop' /tmp/snoop-after
          echo SNOOP_JARVIS_INTEGRATED_PILOT_PUBLISHED_EXECUTION_FLAG_OFF
