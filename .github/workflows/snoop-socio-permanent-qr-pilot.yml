name: SNOOP Socio permanent QR and persistent login pilot
on:
  push:
    branches: [fix/snoop-member-qr-email-registration-20261119]
    paths:
      - apps/socio/**
      - .github/workflows/snoop-socio-permanent-qr-pilot.yml
permissions:
  contents: read
concurrency:
  group: snoop-socio-permanent-qr-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install
      - name: Guard all current member behavior
        run: |
          set -euo pipefail
          node --check apps/socio/main.js
          node apps/socio/check.mjs
          node --test apps/socio/service.test.mjs apps/socio/http.test.mjs apps/socio/auth-supabase.test.mjs apps/socio/worker.test.mjs apps/socio/bootstrap.test.mjs apps/socio/auto-link.test.mjs apps/socio/claim-challenges.test.mjs apps/socio/staff-scanner-http.test.mjs apps/socio/build-public.test.mjs
      - name: Assert QR does not expire or change for menu/navigation and auth persists
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>readFileSync(p,'utf8');
          const ui=read('apps/socio/main.js');
          const service=read('apps/socio/service.mjs');
          const http=read('apps/socio/http.mjs');
          const auth=read('apps/socio/auth-supabase.mjs');
          assert.match(service,/async stableQr\(actor,clubId\)/);
          assert.ok(service.includes("token:'SNOOP:'+item.memberNumber"));
          assert.ok(http.includes('scopedService.stableQr'));
          assert.ok(ui.includes('state.qrClub===id'),'cached member card must be stable');
          assert.ok(!ui.includes('},20000)'),'No automatic QR regeneration every 20 seconds');
          assert.ok(ui.includes("case'clubs':state.page='clubs';break;"));
          assert.ok(ui.includes("case'profile':state.page='profile';break;"));
          assert.ok(!ui.includes("window.addEventListener('pagehide',stopQr)"));
          assert.ok(auth.includes('Max-Age=31536000'));
          assert.ok(auth.includes('HttpOnly; SameSite=Strict'));
          console.log('PASS: permanent QR, unchanged on navigation, rolling secure login');
          NODE
      - name: Package and compile separate app
        run: |
          node apps/socio/build-public.mjs
          test -f apps/socio/dist/main.js
          bunx wrangler deploy --dry-run --config apps/socio/wrangler.pilot.jsonc --outdir "$GITHUB_WORKSPACE/.sandbox/socio-fixed-qr"
  pilot-deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
      SOCIO_ORIGIN: https://snoop-socio-pilot.dmorra024.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install
      - name: Validate exact Worker and existing bindings; never rotate keys
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "0cc8106f8820d22996af3aed9e081e93"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import{readFileSync}from'node:fs';
          const cfg=JSON.parse(readFileSync('apps/socio/wrangler.pilot.jsonc','utf8'));
          assert.equal(cfg.name,'snoop-socio-pilot');
          assert.equal(cfg.vars.SOCIO_ORIGIN,process.env.SOCIO_ORIGIN);
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-socio-pilot/settings';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
          if(!response.ok)throw Error('Existing Socio Worker must be verified before publishing');
          const json=await response.json();
          if(json.success!==true||!Array.isArray(json.result?.bindings))throw Error('Cloudflare bindings unreadable');
          const has=(key,type)=>json.result.bindings.some(b=>b.name===key&&b.type===type);
          if(!has('SOCIO_QR_SIGNING_KEY_BASE64','secret_text')||!has('SOCIO_SUPABASE_PUBLISHABLE_KEY','secret_text'))
           throw Error('Existing secrets unavailable; do not rotate or overwrite keys');
          if(!has('ASSETS','assets'))throw Error('Socio asset binding not installed');
          console.log('Verified isolated Socio worker bindings, existing keys preserved');
          NODE
      - name: Deploy only Socio pilot assets and API; keep existing bindings
        run: |
          set -euo pipefail
          node apps/socio/build-public.mjs
          WRANGLER_SEND_METRICS=false bunx wrangler deploy --config apps/socio/wrangler.pilot.jsonc --keep-vars
      - name: Verify public frontend and reject anonymous member access
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 "$SOCIO_ORIGIN/" -o /tmp/snoop-socio.html
          grep -q 'SNOOP' /tmp/snoop-socio.html
          CODE="$(curl -sS --max-time 25 -o /tmp/socio-reply.json -w '%{http_code}' "$SOCIO_ORIGIN/api/socio/me")"
          test "$CODE" = 401
          echo "SOCIO_PERMANENT_QR_PILOT_RELEASE_SUCCESS"
