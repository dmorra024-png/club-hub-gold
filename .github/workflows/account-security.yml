name: Account security

on:
  pull_request:
  push:
    branches: [codex/stabilize-independent-club, fix/snoop-ai-deploy-guard-test]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Bun
        run: npm install --prefix "$RUNNER_TEMP/bun-tools" --no-package-lock --no-audit --no-fund bun@1.3.12
      - name: Install locked dependencies
        run: '"$RUNNER_TEMP/bun-tools/node_modules/.bin/bun" install --frozen-lockfile'
      - run: npm test
      - name: PostgreSQL concurrent accounting checks (synthetic, isolated)
        run: npm run test:annulment:concurrency
      - run: npm run typecheck
      - run: npm run build
      - name: Account HTTP smoke test
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/account-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/auth >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/account-server.log"
            exit 1
          fi
          npm run test:smoke:accounts
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium webkit
      - name: Production PWA and administrative browser tests
        shell: bash
        run: |
          NITRO_PORT=3001 npm start > "$RUNNER_TEMP/production-server.log" 2>&1 &
          production_pid=$!
          trap 'kill "$production_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/auth >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/production-server.log"
            exit 1
          fi
          npm run test:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:discounts:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:annulment:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:records:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:catalog:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:orders:keyboard
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:completion:mobile
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:account-links
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:pwa:resume
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:premium:home
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:cash:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:critical:browser
          npm run test:voice:lifecycle
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice:conversation
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice:session
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice2:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:genetics:browser
      - name: Save real premium home browser renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snoop-premium-home
          path: |
            .sandbox/screenshots/premium/
            .sandbox/PREMIUM_HOME_RESULTS.json
            docs/screenshots/genetics-*.png
            docs/GENETICS_BROWSER_RESULTS.json
            docs/VOICE2_ADMINISTRATIVE_BROWSER_RESULTS.json
            docs/screenshots/voice2-*.png
            docs/screenshots/voice-session-*.png
            docs/VOICE_SESSION_RESULTS.json
            docs/VOICE_CONVERSATION_RESULTS.json
            docs/ORDER_KEYBOARD_RESULTS.json
            docs/screenshots/order-keyboard-*.png
            docs/screenshots/voice-conversation-*.png
            docs/screenshots/critical-*.png
            docs/CRITICAL_BROWSER_RESULTS.json
            docs/CAJA_BROWSER_RESULTS.json
            docs/screenshots/caja-simple-*.png
          if-no-files-found: ignore
          retention-days: 7
