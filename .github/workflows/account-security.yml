name: Account security

on:
  pull_request:
  push:
    branches: [codex/stabilize-independent-club, fix/snoop-ai-deploy-guard-test]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Bun
        run: npm install --prefix "$RUNNER_TEMP/bun-tools" --no-package-lock --no-audit --no-fund bun@1.3.12
      - name: Install locked dependencies
        run: '"$RUNNER_TEMP/bun-tools/node_modules/.bin/bun" install --frozen-lockfile'
      - run: npm test
      - name: PostgreSQL concurrent accounting checks (synthetic, isolated)
        run: npm run test:annulment:concurrency
      - run: npm run typecheck
      - run: npm run build
      - name: Account HTTP smoke test
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/account-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/auth >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/account-server.log"
            exit 1
          fi
          npm run test:smoke:accounts
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium webkit
      - name: Production PWA and administrative browser tests
        shell: bash
        run: |
          NITRO_PORT=3001 npm start > "$RUNNER_TEMP/production-server.log" 2>&1 &
          production_pid=$!
          trap 'kill "$production_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/auth >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/production-server.log"
            exit 1
          fi
          npm run test:browser
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true node scripts/test-member-administration.mjs
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:discounts:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:annulment:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:records:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:catalog:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:orders:keyboard
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:completion:mobile
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:account-links
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:pwa:resume
          TEST_BASE_URL=http://127.0.0.1:3001 TEST_WEBKIT=true npm run test:premium:home
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:cash:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:cash:consistency
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:critical:browser
          npm run test:voice:lifecycle
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice:conversation
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:ai:dialogue
          TEST_BASE_URL=http://127.0.0.1:3001 node scripts/test-voice2-administration.mjs --diagnostics
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice:session
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice2:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:voice:browser
          TEST_BASE_URL=http://127.0.0.1:3001 npm run test:genetics:browser
          TEST_BASE_URL=http://127.0.0.1:3001 node scripts/test-deepgram-app.mjs
      - name: Save real premium home browser renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snoop-premium-home
          path: |
            .sandbox/screenshots/premium/
            .sandbox/PREMIUM_HOME_RESULTS.json
            docs/screenshots/genetics-*.png
            docs/GENETICS_BROWSER_RESULTS.json
            docs/VOICE2_ADMINISTRATIVE_BROWSER_RESULTS.json
            docs/screenshots/voice2-*.png
            docs/screenshots/voice-session-*.png
            docs/VOICE_SESSION_RESULTS.json
            docs/VOICE_CONVERSATION_RESULTS.json
            docs/SNOOP_AI_DIALOGUE_RESULTS.json
            docs/SNOOP_VOICE_DIAGNOSTICS_RESULTS.json
            docs/screenshots/snoop-private-diagnostics-*.png
            docs/screenshots/snoop-ai-dialogue-*.png
            docs/ORDER_KEYBOARD_RESULTS.json
            docs/screenshots/order-keyboard-*.png
            docs/screenshots/voice-conversation-*.png
            docs/screenshots/critical-*.png
            docs/CRITICAL_BROWSER_RESULTS.json
            docs/CAJA_BROWSER_RESULTS.json
            docs/CASH_CONSISTENCY_RESULTS.json
            docs/screenshots/cash-consistency-*.png
            docs/screenshots/caja-simple-*.png
          if-no-files-found: ignore
          retention-days: 7

  informes-visual-validation:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/snoop-informes-category-chart-readable-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Verify scoped application files
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/release/snoop-informes-themed-analytics-20261123)"
          actual="$(git diff --name-only "$BASE" HEAD -- src apps/socio)"
          expected="$(printf '%s\n' 'src/routes/_authenticated/ajustes.informes.tsx' 'src/styles.css')"
          test "$actual" = "$expected" || { echo "Unexpected application changes: $actual"; exit 1; }
          git diff --exit-code "$BASE" HEAD -- src/routes/_authenticated/caja.tsx src/lib apps/socio
      - run: bun install --frozen-lockfile
      - name: Scoped Informes regression including dates, chart and unchanged Caja
        run: node --test tests/snoop-informes-custom-range.test.mjs tests/snoop-informes-category-chart.test.mjs tests/snoop-informes-themed-insights.test.mjs tests/simple-cash.test.mjs
      - name: Typecheck and Cloudflare safety dry-run
        run: |
          set -euo pipefail
          bun run typecheck
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
