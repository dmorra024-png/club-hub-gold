name: SNOOP local document OCR — lock and verify only

on:
  push:
    branches:
      - integration/snoop-monederosocio-management-20261118
    paths:
      - package.json
      - scripts/prepare-local-document-ocr.mjs
      - src/lib/local-document-ocr.ts
      - src/lib/local-document-mrz.ts
      - src/routes/_authenticated/soci.nuovo.tsx
      - .github/workflows/snoop-local-document-ocr.yml

permissions:
  contents: write

concurrency:
  group: snoop-local-ocr-lock
  cancel-in-progress: false

jobs:
  verify-and-pin:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.ref == 'refs/heads/integration/snoop-monederosocio-management-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Resolve only pinned OCR packages and update Bun lockfile
        run: |
          set -euo pipefail
          bun install
          node scripts/prepare-local-document-ocr.mjs
          bun run typecheck
          node --test tests/local-document-mrz.test.ts
          bun run build
      - name: Commit only regenerated dependency lockfile (never deploy)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- bun.lock; then
            git add -- bun.lock
            git commit -m "build(documents): lock local OCR packages after verified build"
            git push origin HEAD:integration/snoop-monederosocio-management-20261118
          fi
