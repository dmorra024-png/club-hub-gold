name: Verify OCR overlay against ACTIVE SNOOP v89 — no deploy
on:
  push:
    branches:
      - integration/snoop-monederosocio-management-20261118
    paths:
      - scripts/isolated-ocr-overlay.mjs
      - src/lib/local-document-mrz.ts
      - src/lib/local-document-ocr.ts
      - tests/local-document-mrz.test.ts
      - src/routes/_authenticated/soci.nuovo.tsx
      - .github/workflows/snoop-ocr-isolated-verify.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'dmorra024-png/club-hub-gold'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SNOOP_RUNTIME: cloudflare
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ocr
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 1aa5c77388a08d89fa63a4c0204ece8b54c00e79
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Build fail-closed overlay from only known OCR changes
        run: node ocr/scripts/isolated-ocr-overlay.mjs "$PWD/baseline" "$PWD/ocr"
      - name: Assert NO other tracked source changes
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed
          printf 'package.json\nsrc/routes/_authenticated/soci.nuovo.tsx\n' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git status --short
      - name: Install, test, typecheck and build production Worker (no upload)
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          bun install
          node scripts/prepare-local-document-ocr.mjs
          node --test tests/local-document-mrz.test.ts
          bun run typecheck
          bun run build:worker
          bun run worker:dry-run
          echo 'SNOOP_OCR_LIVE_BASELINE_TESTS_PASSED_NO_DEPLOY'
