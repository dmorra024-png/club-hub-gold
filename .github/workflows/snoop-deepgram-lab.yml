name: SNOOP Deepgram isolated voice lab
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "DEPLOY-SNOOP-VOICE-LAB-6e10995 only"
        required: true
        type: string
  push:
    branches: [codex/deepgram-voice-lab]
    paths: ["lab/deepgram/**", ".github/workflows/snoop-deepgram-lab.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: snoop-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Read only snoop-voice-lab metadata (no secret values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
        run: node lab/deepgram/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snoop-deepgram-lab-inspection
          path: .sandbox/deepgram-lab/inspection.json
  prototype:
    needs: inspect
    if: contains(github.event.head_commit.message, '[lab-prototype]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: snoop-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Typecheck and validate SNOOP proposal permissions
        run: |
          npx tsc -p lab/deepgram/tsconfig.json --noEmit
          node --test --experimental-test-isolation=none lab/deepgram/policy.test.ts
          node lab/deepgram/build.mjs
          node lab/deepgram/test-worker.mjs
          node lab/deepgram/test-audio-relay.mjs
      - name: Chromium and WebKit lab UI regression (synthetic microphone only)
        run: |
          npx playwright-core install --with-deps chromium webkit
          node lab/deepgram/test-browser.mjs
      - name: Update only snoop-voice-lab and test two fixed synthetic audio sessions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
          SNOOP_LAB_ONLY: CONFIRM_ISOLATED_DEEPGRAM_SYNTHETIC
        run: node lab/deepgram/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snoop-deepgram-lab-results
          path: |
            .sandbox/deepgram-lab/deployment.json
            .sandbox/deepgram-lab/live-results.json
            .sandbox/deepgram-lab/deepgram-*-reply.wav
            .sandbox/deepgram-lab/browser-results.json
            .sandbox/deepgram-lab/lab-*.png
  verify-only:
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, '[lab-prototype]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - name: Regression and lab policy checks (synthetic only)
        run: |
          npm test
          npm run typecheck
          npx tsc -p lab/deepgram/tsconfig.json --noEmit
          node --test --experimental-test-isolation=none lab/deepgram/*.test.ts
          node lab/deepgram/build.mjs
          node lab/deepgram/test-worker.mjs
          node lab/deepgram/test-audio-relay.mjs
      - name: Chromium and WebKit lab checks (no real microphone or provider)
        run: |
          npx playwright-core install --with-deps chromium webkit
          node lab/deepgram/test-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snoop-lab-tuning-browser-results
          path: |
            .sandbox/deepgram-lab/browser-results.json
            .sandbox/deepgram-lab/lab-*.png

  release-authorized-6e10995:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'dmorra024-png/club-hub-gold' && inputs.confirm == 'DEPLOY-SNOOP-VOICE-LAB-6e10995'
    needs: inspect
    concurrency:
      group: snoop-voice-lab-manual
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # This environment only supplies the existing token; it is NOT the Worker target.
    environment: snoop-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e10995990ec43ea047992277663c714146912fd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - name: Verify exact authorized source, typecheck and isolated tests before publishing
        run: |
          test "$(git rev-parse HEAD)" = 6e10995990ec43ea047992277663c714146912fd
          npx tsc -p lab/deepgram/tsconfig.json --noEmit
          node --test --experimental-test-isolation=none lab/deepgram/*.test.ts
          node lab/deepgram/build.mjs
          node lab/deepgram/test-worker.mjs
          node lab/deepgram/test-audio-relay.mjs
          npx playwright-core install --with-deps chromium webkit
          node lab/deepgram/test-browser.mjs
      - name: Preserve existing configuration and publish once to snoop-voice-lab only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
          SNOOP_LAB_ONLY: CONFIRM_ISOLATED_DEEPGRAM_SYNTHETIC
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {writeFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const sha='6e10995990ec43ea047992277663c714146912fd';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sha);
          const base='https://api.cloudflare.com/client/v4/accounts/0cc8106f8820d22996af3aed9e081e93/workers/scripts/snoop-voice-lab';
          const transport=globalThis.fetch;
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`};
          async function readSettings(){
            const r=await transport(base+'/settings',{headers,redirect:'error',signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,'LAB_PREFLIGHT_SETTINGS_FAILED');const j=await r.json();assert(j.success,'LAB_SETTINGS_FAILED');return j.result;
          }
          const before=await readSettings();
          const fields=['compatibility_date','compatibility_flags','usage_model','limits','placement','logpush','tail_consumers','streaming_tail_consumers','observability','tags','annotations'];
          const readonly=['main_module','body_part','created_on','modified_on','etag','handlers','has_modules','has_assets','last_deployed_from','deployment_id'];
          assert(Object.keys(before).every(k=>k==='bindings'||fields.includes(k)||readonly.includes(k)),'LAB_UNRECOGNIZED_CONFIGURATION_STOP_BEFORE_UPLOAD');
          assert(!(before.tail_consumers?.length||before.streaming_tail_consumers?.length),'LAB_OTHER_WORKER_CONNECTION_STOP_BEFORE_UPLOAD');
          assert(before.bindings.every(b=>['secret_text','plain_text','json','ai'].includes(b.type)),'LAB_UNAPPROVED_RESOURCE');
          let uploads=0;
          globalThis.fetch=async(url,init={})=>{
            assert(typeof url==='string'&&['','/settings','/content/v2'].some(suffix=>url===base+suffix),'LAB_TARGET_SCOPE_REJECTED');
            if((init.method||'GET')!=='GET'){
              assert.equal(url,base);assert.equal(init.method,'PUT');assert.equal(++uploads,1,'LAB_SECOND_UPLOAD_REJECTED');
              const metadata=JSON.parse(init.body.get('metadata'));
              assert(metadata.keep_bindings.includes('secret_text')&&metadata.keep_bindings.includes('secret_key'),'LAB_SECRET_INHERITANCE_REQUIRED');
              assert(!metadata.bindings.some(b=>['secret_text','secret_key'].includes(b.type)),'LAB_SECRET_WRITES_REJECTED');
              for(const key of fields)if(Object.hasOwn(before,key))metadata[key]=before[key];
              metadata.bindings=before.bindings.filter(b=>b.type==='ai');
              init.body.set('metadata',JSON.stringify(metadata));
            }
            return transport(url,init);
          };
          // Stamp the application source revision, not this workflow controller revision.
          process.env.GITHUB_SHA=sha;
          let failure;
          try{await import(pathToFileURL(resolve('lab/deepgram/deploy.mjs')).href);}catch(e){failure=e;}
          if(uploads){
            const after=await readSettings();
            const canonical=value=>value===null||typeof value!=='object'?value:Array.isArray(value)?value.map(canonical):Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonical(value[k])]));
            const hash=value=>createHash('sha256').update(JSON.stringify(canonical(value))).digest('hex');
            const snapshot=s=>({bindings:[...s.bindings].sort((a,b)=>a.name.localeCompare(b.name)),...Object.fromEntries(fields.filter(k=>Object.hasOwn(before,k)).map(k=>[k,s[k]]))});
            const preserved=hash(snapshot(before))===hash(snapshot(after));
            await writeFile('.sandbox/deepgram-lab/configuration-preservation.json',JSON.stringify({worker:'snoop-voice-lab',sourceSha:sha,uploads,configurationPreserved:preserved,checkedFields:fields.filter(k=>Object.hasOwn(before,k)),secretWrites:false,productionTouched:false},null,2));
            assert(preserved,'LAB_CONFIGURATION_CHANGED');
          }
          if(failure)throw failure;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snoop-voice-lab-release-6e10995
          path: |
            .sandbox/deepgram-lab/deployment.json
            .sandbox/deepgram-lab/configuration-preservation.json
            .sandbox/deepgram-lab/live-results.json
            .sandbox/deepgram-lab/browser-results.json
            .sandbox/deepgram-lab/deepgram-*-reply.wav
