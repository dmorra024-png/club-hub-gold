name: SNOOP Dual Stock — guarded pilot release
on:
  push:
    branches: [feature/snoop-double-stock-20261123]
    paths: [docs/DUAL_STOCK_DEPLOY_TRIGGER.md]
permissions:
  contents: read
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.event.head_commit.message == 'deploy-snoop-dual-stock-pilot'
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - name: Verify scoped stock UI changes and SNOOP pilot target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/snoop-double-stock-20261123"
          VERIFIED=3d8e994fb0a9d326fcf16963bbb3d1cee325c48c
          git cat-file -e "$VERIFIED^{commit}"
          git diff --exit-code "$VERIFIED" HEAD -- apps/socio src/components/DeepgramPilotVoice.tsx src/lib/deepgram-app-gateway.ts src/lib/voice src/lib/cash-ledger.ts src/lib/cash-sessions.functions.ts src/lib/cash-sessions.server.ts src/lib/member-order-history.server.ts package.json bun.lock wrangler.json supabase scripts tests
          node -e 'const c=require("./wrangler.json");if(c.name!=="snoop-pilot"||c.workers_dev!==true||c.ai?.binding!=="SNOOP_AI"||c.assets?.binding!=="ASSETS"||c.vars?.SNOOP_RESOURCE_NAMESPACE!=="snoop-pilot")process.exit(1)'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: bun install --frozen-lockfile
      - name: Verify build, authorization boundaries and client bundle
        run: |
          set -euo pipefail
          bun run build:worker
          bun run typecheck
          bun run test:security:architecture
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Read-only verify protected Worker bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(res.status,200);
          const body=await res.json();
          assert.equal(body.success,true);
          const b=body.result?.bindings||[];
          for(const [name,type] of [['SUPABASE_SERVICE_ROLE_KEY','secret_text'],['SOCIO_QR_SIGNING_KEY_BASE64','secret_text'],['SNOOP_AI','ai'],['ASSETS','assets']]){
            assert.ok(b.some(x=>x.name===name&&x.type===type),'Missing protected binding '+name);
          }
          assert.equal(new Set(b.map(x=>x.name)).size,b.length);
          console.log('Existing protected bindings verified; no secret values read or changed.');
          NODE
      - name: Pre-deploy pilot availability check
        run: curl -fsS --max-time 25 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-before
      - name: Publish two-location inventory UI to snoop-pilot while preserving bindings
        run: WRANGLER_SEND_METRICS=false bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Verify pilot is online
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-after
          grep -qi 'snoop' /tmp/snoop-after
          echo 'SNOOP_DUAL_STOCK_PILOT_PUBLISHED'
