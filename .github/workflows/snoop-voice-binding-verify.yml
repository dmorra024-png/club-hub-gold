name: SNOOP Worker AI binding targeted verification
on:
  push:
    branches: [fix/snoop-worker-ai-binding-20261115, codex/jarvis3-voice]
    paths:
      - src/server.ts
      - src/lib/workers-ai.server.ts
      - scripts/test-voice-worker-binding.mjs
      - tests/workers-ai.test.ts
      - .github/workflows/snoop-voice-binding-verify.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/snoop-worker-ai-binding-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: snoop-pilot
    env:
      SNOOP_RUNTIME: cloudflare
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Request-isolation regression tests
        run: node --test --experimental-test-isolation=none tests/workers-ai.test.ts tests/voice-activation.test.ts
      - name: TypeScript checks
        run: npm run typecheck
      - name: Build real Cloudflare Worker
        run: npm run build:worker
      - name: Actual Workerd request and audio transport (synthetic only)
        run: node scripts/test-voice-worker-binding.mjs
      - name: Wrangler dry run (no deployment)
        run: npm run worker:dry-run

  verify-synthetic:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.ref == 'refs/heads/codex/jarvis3-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prepare local synthetic build settings (no credentials)
        run: |
          cat > .env.sandbox.local <<'ENV'
          VITE_SUPABASE_URL=/sandbox-api
          SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_SYNTHETIC
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_SYNTHETIC
          SNOOP_RESOURCE_NAMESPACE=snoop-pilot
          AI_PERSONAL_DATA_PROCESSING_ENABLED=false
          APP_URL=http://127.0.0.1:8798
          ENV
      - name: TypeScript checks
        run: npm run typecheck
      - name: Build Cloudflare Worker without credentials
        run: npm run build:worker:test
      - name: Actual Workerd request, audio and bounded error transport (synthetic only)
        run: node scripts/test-voice-worker-binding.mjs
      - name: Verify public bundle
        run: npm run test:security:bundle
      - name: Wrangler dry run (no deployment)
        run: npm run worker:dry-run
