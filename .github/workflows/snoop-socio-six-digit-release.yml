name: Release SNOOP Socio six-digit client pilot
on:
  push:
    branches: [fix/snoop-socio-six-digit-email-flow-20261119]
    paths:
      - docs/SOCIO_SIX_DIGIT_RELEASE_TRIGGER.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snoop-socio-pilot-deploy
  cancel-in-progress: false
jobs:
  deploy-socio:
    if: ${{ github.repository == 'dmorra024-png/club-hub-gold' && github.ref_name == 'fix/snoop-socio-six-digit-email-flow-20261119' && github.event.head_commit.message == 'release-snoop-socio-six-digit-pilot' }}
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
      SOCIO_ORIGIN: https://snoop-socio-pilot.dmorra024.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check isolated member application, OTP and stable QR
        run: |
          set -euo pipefail
          node apps/socio/check.mjs
          node --test tests/socio-six-digit-flow.test.mjs apps/socio/domain.test.mjs apps/socio/service.test.mjs apps/socio/http.test.mjs apps/socio/auth-supabase.test.mjs apps/socio/supabase-rls.test.mjs apps/socio/integration.test.mjs apps/socio/worker.test.mjs
          node apps/socio/build-public.mjs
          WRANGLER_SEND_METRICS=false bunx wrangler deploy --dry-run --config apps/socio/wrangler.pilot.jsonc --outdir .sandbox/socio-six-digit-dry-run
      - name: Check dedicated Worker existing secret bindings (no values)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-socio-pilot/settings',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
          assert.equal(res.status,200);
          const data=await res.json();assert.equal(data.success,true);
          assert.ok(Array.isArray(data.result?.bindings));
          const bs=data.result.bindings;
          for(const [name,type] of [['SOCIO_QR_SIGNING_KEY_BASE64','secret_text'],['SOCIO_SUPABASE_PUBLISHABLE_KEY','secret_text'],['ASSETS','assets']]){
            assert.ok(bs.some(b=>b.name===name&&b.type===type),'Required existing binding missing: '+name);
          }
          assert.equal(new Set(bs.map(b=>b.name)).size,bs.length);
          console.log('Existing Socio bindings verified; no keys rotated');
          NODE
      - name: Publish separate Socio Worker, preserving all existing secrets
        run: |
          set -euo pipefail
          WRANGLER_SEND_METRICS=false bunx wrangler deploy --config apps/socio/wrangler.pilot.jsonc --keep-vars
      - name: Check HTTPS client and deny anonymous access
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 "$SOCIO_ORIGIN/" -o /tmp/socio-index
          grep -q 'SNOOP' /tmp/socio-index
          curl -fsS --max-time 25 "$SOCIO_ORIGIN/main.js" -o /tmp/socio-main
          grep -q 'Introduce tu código' /tmp/socio-main
          code="$(curl -sS --max-time 25 -o /tmp/socio-anon -w '%{http_code}' "$SOCIO_ORIGIN/api/socio/me")"
          test "$code" = 401
          echo 'SNOOP_SOCIO_SIX_DIGIT_CLIENT_PILOT_DEPLOYED'
