name: SNOOP management header center and QR pilot
on:
  push:
    branches: [fix/snoop-header-true-center-qr-clean-20261120]
    paths: [docs/SNOOP_HEADER_QR_RELEASE_TRIGGER.md]
permissions:
  contents: read
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'dmorra024-png/club-hub-gold'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.12'}
      - run: bun install --frozen-lockfile
      - name: Guard against functional changes and all SNOOP Socio modifications
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/feature/snoop-socio-mailjet-email-20261120)"
          git diff --quiet "$BASE" HEAD -- apps/socio src/lib src/routes || { echo 'Unauthorized business/auth route change'; exit 1; }
          changed="$(git diff --name-only "$BASE" HEAD -- src/components src/styles.css | grep -v -E '^src/components/(SnoopLayout|SnoopDockIcon)\.tsx$|^src/styles\.css$' || true)"
          test -z "$changed" || { echo 'Unexpected component changes'; echo "$changed"; exit 1; }
      - name: Verify navigation and visual scope
        run: node --test tests/snoop-gestionale-visual-consistency.test.mjs
      - name: Check isolated OTP, tenant scope, admin typecheck
        run: |
          set -euo pipefail
          node --test tests/socio-six-digit-flow.test.mjs tests/socio-mailjet-provider.test.mjs
          bun run test:security:architecture
          bun run typecheck
      - name: Compile and dry-run management Worker
        run: |
          set -euo pipefail
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Require expected live bindings without exposing secrets
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings';
          const res=await fetch(url,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
          assert.equal(res.status,200);
          const j=await res.json();assert.equal(j.success,true);
          const b=j.result?.bindings||[];
          for(const [name,types] of Object.entries({
            MAILJET_API_KEY:['secret_text'],MAILJET_SECRET_KEY:['secret_text'],MAILJET_FROM:['plain_text','secret_text'],
            EMAIL_API_KEY:['secret_text'],EMAIL_FROM:['plain_text'],SUPABASE_SERVICE_ROLE_KEY:['secret_text'],
            SOCIO_QR_SIGNING_KEY_BASE64:['secret_text'],SNOOP_AI:['ai'],ASSETS:['assets']
          })){
            assert.ok(b.some(x=>x.name===name&&types.includes(x.type)),'Missing expected management binding '+name);
          }
          assert.equal(new Set(b.map(x=>x.name)).size,b.length);
          console.log('Management bindings verified; no values read or changed.');
          NODE
  deploy:
    needs: preflight
    if: github.event.head_commit.message == 'release-snoop-header-qr-pilot'
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.12'}
      - run: bun install --frozen-lockfile
      - name: Build exact guarded management Worker
        run: |
          set -euo pipefail
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Publish pilot management; do not rotate or replace secrets
        run: WRANGLER_SEND_METRICS=false bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Verify management public HTTPS only
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-root
          grep -q 'SNOOP' /tmp/snoop-root
          echo 'SNOOP_GESTIONALE_VISUAL_PILOT_DEPLOYED'
