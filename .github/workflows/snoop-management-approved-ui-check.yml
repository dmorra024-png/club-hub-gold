name: SNOOP management approved dashboard build and access checks
on:
  push:
    branches: [feature/snoop-management-approved-desktop-ui-20261119]
    paths:
      - .github/workflows/snoop-management-approved-ui-check.yml
      - src/routes/_authenticated/index.tsx
      - src/styles.css
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install
      - name: Verify management dashboard and sensitive-data boundaries
        run: |
          bun run typecheck
          bun run test:security:architecture
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const home=readFileSync('src/routes/_authenticated/index.tsx','utf8');
          const css=readFileSync('src/styles.css','utf8');
          for(const key of ['snoop-dashboard-head','snoop-dashboard-summary','snoop-reference-cash','snoop-reference-shifts','snoop-actions-grid','ClubActivities'])assert.ok(home.includes(key),key);
          for(const key of ['snoop-dashboard-head','snoop-dashboard-summary','snoop-reference-shifts','snoop-actions-grid'])assert.ok(css.includes('.'+key),key);
          assert.match(home,/can\("use_cash"\)/);
          assert.match(home,/\.eq\("club_id",access\.clubId!\)/);
          assert.match(home,/setShiftSessions\(\[\]\)/);
          assert.ok(!home.includes('1.482,35'),'No mockup cash may enter live UI');
          console.log('PASS approved dashboard structure, permission checks and no fake data');
          NODE
      - name: Compile Cloudflare Worker without deployment
        env:
          SNOOP_RESOURCE_NAMESPACE: snoop-pilot
          SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
          VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: |
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
