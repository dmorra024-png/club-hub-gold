name: SNOOP Deepgram App Pilot Verification
on:
  push:
    branches: [feature/deepgram-admin-pilot-20261116]
  pull_request:
    branches: [codex/jarvis3-voice, codex/stabilize-independent-club]
permissions:
  contents: read
jobs:
  isolated-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: Pilot policy and fail-closed authorization
        run: node --test --experimental-test-isolation=none src/lib/deepgram-pilot-policy.test.ts
      - name: Type checking
        run: npm run typecheck
      - name: Application regression checks
        run: npm test
      - name: Actual Workerd gateway with synthetic upstreams
        run: node scripts/test-deepgram-app-worker.mjs
      - name: Consecutive turns without optional thinking events (synthetic)
        run: node scripts/test-deepgram-app-worker.mjs --no-thinking
      - name: Prepare isolated synthetic build settings
        run: |
          cat > .env.sandbox.local <<'ENV'
          VITE_SUPABASE_URL=/sandbox-api
          SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_SYNTHETIC
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_SYNTHETIC
          SNOOP_RESOURCE_NAMESPACE=snoop-pilot
          AI_PERSONAL_DATA_PROCESSING_ENABLED=false
          APP_URL=http://127.0.0.1:8798
          ENV
      - name: Build authenticated application Worker (synthetic, no secrets)
        run: npm run build:worker:test
      - name: Dry-run only (no upload)
        run: npm run worker:dry-run
      - name: Compiled application WebSocket regression (synthetic)
        run: node scripts/test-deepgram-app-worker.mjs --compiled
      - name: Scan public bundle for credentials
        run: npm run test:security:bundle
      - name: No deployment or database writes
        run: echo "Verification only; no production deployment, cloud provider login, or data mutations"
