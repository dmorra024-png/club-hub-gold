name: Restore approved SNOOP Socio UI pilot
on:
  push:
    branches: [restore/snoop-socio-approved-ui-20261120]
    paths: [docs/SOCIO_APPROVED_UI_RELEASE_TRIGGER.md]
permissions:
  contents: read
concurrency:
  group: snoop-socio-pilot-deploy
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.repository == 'dmorra024-png/club-hub-gold' && github.event.head_commit.message == 'release-snoop-socio-approved-ui-pilot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.12'}
      - run: bun install --frozen-lockfile
      - name: Prove no changes to member security or server logic since live baseline
        run: |
          set -euo pipefail
          git diff --exit-code 8c6f2ddc6773af45e1457b458a84342e5824f4f0 HEAD -- apps/socio/worker.mjs apps/socio/auth-supabase.mjs apps/socio/supabase-rls.mjs apps/socio/service.mjs apps/socio/domain.mjs
      - name: Full isolated member checks and approved UI contract
        run: |
          set -euo pipefail
          node apps/socio/check.mjs
          node --test apps/socio/*.test.mjs tests/socio-six-digit-flow.test.mjs
          node apps/socio/build-public.mjs
          test -s apps/socio/dist/approved-ui.css
          grep -q 'approved-member-card' apps/socio/dist/approved-ui.css
          grep -q 'approved-dock' apps/socio/dist/main.js
          WRANGLER_SEND_METRICS=false bunx wrangler deploy --dry-run --config apps/socio/wrangler.pilot.jsonc --outdir .sandbox/socio-approved-ui-dry-run
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
      SOCIO_ORIGIN: https://snoop-socio-pilot.dmorra024.workers.dev
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.12'}
      - run: bun install --frozen-lockfile
      - name: Confirm existing Worker bindings without reading secret values
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-socio-pilot/settings';
          const res=await fetch(url,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
          assert.equal(res.status,200);
          const j=await res.json();assert.equal(j.success,true);
          const bs=j.result?.bindings||[];
          for(const [name,type] of [['SOCIO_QR_SIGNING_KEY_BASE64','secret_text'],['SOCIO_SUPABASE_PUBLISHABLE_KEY','secret_text'],['ASSETS','assets']])
            assert.ok(bs.some(b=>b.name===name&&b.type===type),'Required Socio binding missing: '+name);
          console.log('Existing bindings confirmed. Values are not read or changed.');
          NODE
      - name: Publish approved Socio frontend while retaining Worker secrets
        run: |
          set -euo pipefail
          node apps/socio/build-public.mjs
          WRANGLER_SEND_METRICS=false bunx wrangler deploy --config apps/socio/wrangler.pilot.jsonc --keep-vars
      - name: Confirm new UI live and anonymous isolation intact
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 "$SOCIO_ORIGIN/" -o /tmp/socio-index
          grep -q 'approved-ui.css' /tmp/socio-index
          curl -fsS --max-time 25 "$SOCIO_ORIGIN/approved-ui.css" -o /tmp/approved-ui
          grep -q 'approved-member-card' /tmp/approved-ui
          curl -fsS --max-time 25 "$SOCIO_ORIGIN/main.js" -o /tmp/socio-main
          grep -q 'approved-dock' /tmp/socio-main
          code="$(curl -sS --max-time 25 -o /tmp/socio-anon -w '%{http_code}' "$SOCIO_ORIGIN/api/socio/me")"
          test "$code" = 401
          echo 'SNOOP_SOCIO_APPROVED_UI_LIVE_PASS'
