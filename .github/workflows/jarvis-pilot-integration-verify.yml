name: JARVIS Pilot integration — fast guarded verification
on:
  push:
    branches: [integration/jarvis-pilot-safe-20261124]
    paths:
      - .github/workflows/jarvis-pilot-integration-verify.yml
      - src/**
      - tests/**
      - scripts/**
      - docs/JARVIS_EXECUTION*
      - docs/sql/SNOOP_VOICE_EXECUTION*
      - docs/JARVIS_SAFE_VERIFY_TRIGGER.md
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'dmorra024-png/club-hub-gold'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - run: bun install --frozen-lockfile
      - name: Isolated voice and architecture tests
        run: |
          set -euo pipefail
          node --test --experimental-test-isolation=none tests/voice-execution-registry.test.ts tests/voice-audio-health.test.ts tests/voice-member-creation-fields.test.ts tests/voice-records-read.test.ts
          bun run test:security:architecture
      - name: Types and deployable pilot Worker
        run: |
          set -euo pipefail
          bun run typecheck
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
