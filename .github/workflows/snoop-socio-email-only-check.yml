name: SNOOP Socio email-only member registration and QR QA
on:
  push:
    branches: [fix/snoop-member-qr-email-registration-20261119]
    paths:
      - .github/workflows/snoop-socio-email-only-check.yml
      - src/routes/_authenticated/soci.$id.tsx
      - src/components/SocioClientLinkPanel.tsx
      - src/lib/socio-invitation-email.functions.ts
      - src/routes/_authenticated/soci.gestisci.tsx
      - src/lib/legacy-member-qr.ts
      - apps/socio/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install
      - name: Verify management and member app
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test:security:architecture
          bun run test:voice:activation
          node apps/socio/check.mjs
          node --test apps/socio/service.test.mjs apps/socio/http.test.mjs apps/socio/auth-supabase.test.mjs apps/socio/worker.test.mjs apps/socio/bootstrap.test.mjs apps/socio/auto-link.test.mjs apps/socio/claim-challenges.test.mjs apps/socio/staff-scanner-http.test.mjs apps/socio/supabase-rls.test.mjs apps/socio/build-public.test.mjs
      - name: Enforce email-only management UI, permanent scanner-friendly client QR and no manual codes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import{readFileSync}from'node:fs';
          const get=p=>readFileSync(p,'utf8');
          const management=get('src/routes/_authenticated/soci.$id.tsx');
          const panel=get('src/components/SocioClientLinkPanel.tsx');
          const mail=get('src/lib/socio-invitation-email.functions.ts');
          const repo=get('apps/socio/supabase-rls.mjs');
          const ui=get('apps/socio/main.js');
          const qr=get('apps/socio/worker.mjs');
          const style=get('apps/socio/styles.css');
          assert.ok(!management.includes('QRCode.toDataURL'));
          assert.ok(!management.includes('Compartir carnet QR'));
          assert.ok(!management.includes('Reenviar QR por email'));
          assert.equal((management.match(/<SocioClientLinkPanel/g)||[]).length,1);
          assert.ok(panel.includes('Enviar email App Socio'));
          assert.ok(!panel.includes('Copiar código'));
          assert.ok(!panel.includes('Generar código'));
          assert.ok(mail.includes('sendProviderEmail'));
          assert.ok(!mail.includes('socio_issue_member_claim'),'No access codes generated in admin');
          assert.ok(!mail.includes('link.hash'),'Email contains only app URL');
          assert.ok(repo.includes('/rpc/socio_link_by_verified_email'));
          assert.ok(ui.includes('memberships/sync'));
          assert.ok(!ui.includes('Código de vinculación<input'));
          assert.ok(!ui.includes('input[name="code"]'));
          assert.ok(qr.includes("errorCorrectionLevel:'L'"));
          assert.ok(qr.includes('width:600,margin:4'));
          assert.ok(style.includes('width:min(88vw,370px,100%)'));
          assert.ok(ui.includes("state.qrClub===id"));
          console.log('PASS email-only management, verified-email linking, static large QR and original scanner support');
          NODE
      - name: Build and dry-run management Worker
        env:
          SNOOP_RESOURCE_NAMESPACE: snoop-pilot
          SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
          VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: |
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
  email-provider-readiness:
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
    steps:
      - name: Inspect only secret binding names, never their values
        run: |
          node --input-type=module <<'NODE'
          import{appendFileSync}from'node:fs';
          if(!process.env.CLOUDFLARE_API_TOKEN)throw Error('CLOUDFLARE_API_TOKEN unavailable');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings',{
           headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)
          });
          if(!response.ok)throw Error('Cannot inspect management Worker bindings');
          const json=await response.json();
          if(json.success!==true||!Array.isArray(json.result?.bindings))throw Error('Invalid Cloudflare settings response');
          const b=json.result.bindings;
          const api=b.some(x=>x.name==='EMAIL_API_KEY'&&x.type==='secret_text');
          const from=b.some(x=>x.name==='EMAIL_FROM'&&x.type==='plain_text');
          const fromSecret=b.some(x=>x.name==='EMAIL_FROM'&&x.type==='secret_text');
          const ok=api&&(from||fromSecret);
          console.log(JSON.stringify({emailProviderKeyConfigured:api,senderBindingConfigured:from||fromSecret,readyForEmailOnlyUI:ok}));
          if(!ok)throw Error('Cannot release email-only flow: management pilot has no verified email provider bindings');
          NODE
