name: SNOOP wallet credits and topup methods — guarded pilot release
on:
  push:
    branches: [release/snoop-wallet-credits-topups-20261123]
    paths: [docs/SNOOP_WALLET_CREDITS_RELEASE_TRIGGER.md]
permissions:
  contents: read
concurrency:
  group: snoop-pilot-deploy
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    if: github.repository == 'dmorra024-png/club-hub-gold' && github.event.head_commit.message == 'release-snoop-wallet-credits-pilot'
    runs-on: ubuntu-24.04
    environment: snoop-pilot
    timeout-minutes: 30
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      APP_URL: https://snoop-pilot.dmorra024.workers.dev
      SNOOP_RESOURCE_NAMESPACE: snoop-pilot
      SNOOP_SUPABASE_PROJECT_REF: bnwanxbmprbymbutoths
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SNOOP_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0cc8106f8820d22996af3aed9e081e93
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Exact source gate — release cannot diverge from verified candidate
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED="53db8ae648356ac2e4c2a18d0ce39584a8ff6083"
          git cat-file -e "$VERIFIED^{commit}"
          git diff --exit-code "$VERIFIED" HEAD -- src apps/socio package.json bun.lock wrangler.json scripts tests
          BASE="$(git rev-parse origin/release/snoop-wallet-panel-visible-20261123)"
          actual="$(git diff --name-only "$BASE" HEAD -- src apps/socio)"
          expected="$(printf '%s\n' 'src/components/WalletTopupPanel.tsx' 'src/lib/cash-sessions.ts' 'src/lib/cash-wallet-evidence.server.ts' 'src/lib/wallet-management.functions.ts' 'src/routes/_authenticated/caja.tsx' 'src/routes/_authenticated/soci.$id.pedido.tsx')"
          test "$actual" = "$expected" || { echo 'Unexpected application files'; exit 1; }
          node -e 'const c=require("./wrangler.json");if(c.name!=="snoop-pilot"||c.workers_dev!==true||c.ai?.binding!=="SNOOP_AI"||c.assets?.binding!=="ASSETS"||c.vars?.SNOOP_RESOURCE_NAMESPACE!=="snoop-pilot") process.exit(1)'
          echo 'Source gated to payment selection, cash ledger and merma text only.'
      - name: Guarded cash and security tests
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          node --test tests/snoop-wallet-credit-only-topup-methods.test.mjs tests/snoop-wallet-topup-panel-visible.test.mjs tests/simple-cash.test.mjs
          bun run test:annulment:concurrency
          bun run test:security:architecture
          bun run typecheck
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
      - name: Verify existing Cloudflare Worker bindings (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/snoop-pilot/settings';
          const res=await fetch(url,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(res.status,200);
          const j=await res.json();
          assert.equal(j.success,true);
          const b=j.result?.bindings||[];
          for(const [name,types] of Object.entries({
            SUPABASE_SERVICE_ROLE_KEY:['secret_text'],
            SOCIO_QR_SIGNING_KEY_BASE64:['secret_text'],
            SNOOP_AI:['ai'],
            ASSETS:['assets']
          })){
            assert.ok(b.some(x=>x.name===name&&types.includes(x.type)),'Missing expected binding '+name);
          }
          assert.equal(new Set(b.map(x=>x.name)).size,b.length);
          console.log('Bindings verified by name and type only; no secrets changed.');
          NODE
      - name: Predeploy public health check
        run: curl -fsS --max-time 25 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-previous-home
      - name: Deploy SNOOP pilot only — retain existing bindings
        run: WRANGLER_SEND_METRICS=false bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
      - name: Confirm new public pilot is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://snoop-pilot.dmorra024.workers.dev/ -o /tmp/snoop-published-home
          grep -qi 'snoop' /tmp/snoop-published-home
          echo 'SNOOP_WALLET_CREDITS_PILOT_DEPLOYED'
