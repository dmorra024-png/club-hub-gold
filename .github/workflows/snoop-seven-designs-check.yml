name: SNOOP seven designs integrated release verification (no deployment)
on:
  push:
    branches: [release/snoop-seven-designs-qwen-20261119]
    paths:
      - .github/workflows/snoop-seven-designs-check.yml
permissions:
  contents: read
jobs:
  management:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install
      - name: Ensure seven real UI designs, privacy and access guards
        run: |
          node --test tests/snoop-theme-composition.test.mjs
          node --test tests/qwen-id-fields.test.ts
          bun run test:security:architecture
          bun run test:voice:activation
          bun run typecheck
      - name: Build actual Cloudflare Worker without publishing
        env:
          VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
        run: |
          bun run build:worker
          bun run worker:dry-run
          bun run test:security:bundle
  socio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate member UI and isolated account/wallet roles
        run: |
          node apps/socio/check.mjs
          node --test apps/socio/club-theme.test.mjs apps/socio/service.test.mjs apps/socio/supabase-rls.test.mjs apps/socio/build-public.test.mjs apps/socio/account-completion.test.mjs apps/socio/auth-supabase.test.mjs
          node apps/socio/build-public.mjs
      - name: No deploy or real data changes
        run: echo "Verified sources only."
