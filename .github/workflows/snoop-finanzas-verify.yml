name: SNOOP Finanzas — isolated pilot validation
on:
  push:
    branches: [feature/snoop-expenses-suppliers-20261123]
    paths: [docs/FINANZAS_VERIFY_TRIGGER.md]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'dmorra024-png/club-hub-gold'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      VITE_SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://bnwanxbmprbymbutoths.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SNOOP_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - run: bun install --frozen-lockfile
      - name: Typecheck, architecture and build verification
        run: |
          set -euo pipefail
          bun run build:worker
          bun run typecheck
          bun run test:security:architecture
          bun run worker:dry-run
          bun run test:security:bundle
